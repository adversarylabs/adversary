name: Adversary review

on:
  pull_request:

concurrency:
  group: adversary-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Mount adversary cache
        uses: depot/cache-mount@c4ccf77f90f7fa7df6a002813c0b13f6a5943063 # v1
        with:
          # Packages are content-addressed and publication is lock-protected, so
          # every PR can safely reuse the repository's warm artifact cache.
          name: adversary-${{ github.event.repository.id }}-review-v2
          path: /mnt/adversary

      - name: Run adversaries
        uses: adversarylabs/actions/run@v1
        env:
          CAMEL_API_KEY: ${{ secrets.CAMEL_API_KEY }}
        with:
          adversaries: auto
          # Includes selection-before-download and live lifecycle heartbeats.
          path: .
          data-dir: /mnt/adversary
          include-summary: false
          model: auto
          auth-mode: oidc
          registry-namespace: adversarylabs
