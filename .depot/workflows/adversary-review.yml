name: Adversary review

on:
  pull_request:

concurrency:
  group: adversary-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Mount adversary cache
        uses: depot/cache-mount@c4ccf77f90f7fa7df6a002813c0b13f6a5943063 # v1
        with:
          name: adversary-${{ github.event.repository.id }}-${{ github.event.pull_request.number }}-v1
          path: /mnt/adversary

      - name: Run adversaries
        uses: adversarylabs/actions/run@e9aceca3e1edf2b261ec611a7caba15278135e9e # v1.4.3
        with:
          adversaries: auto
          path: .
          data-dir: /mnt/adversary
          include-summary: false
          model-provider: camel
          model: auto
          model-api-key: ${{ secrets.CAMEL_API_KEY }}
          auth-mode: oidc
          registry-namespace: adversarylabs
