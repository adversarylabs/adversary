name: adversarylabs/example
version: 1.2.3
uses:
  - name: go/concurrency
    version: "0.1.0"
  - name: review/engineering
triggers:
  files_changed: ["**/*.go"]
runtime:
  name: node
  version: "22"
  command: [dist/index.js]
permissions:
  filesystem:
    read: ["."]
  network: false
  environment:
    allow: [CI]
findings:
  format: adversary.review.v1
